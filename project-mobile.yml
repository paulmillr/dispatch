      - Dispatch/Views/Chrome.swift
      - Dispatch/Views/ComposerFences.swift
      - Dispatch/Views/HostGlyph.swift
      - Dispatch/Views/HostTint.swift
      - Dispatch/WorkspaceModels.swift
      # The watch protocol (docs/watch.md): the phone's side of WatchConnectivity is in Mobile/Watch.
      - path: Watch/Shared
    settings:
      groups: [ios, mobileApp]
      base:
        PRODUCT_NAME: DispatchMobile
        PRODUCT_MODULE_NAME: DispatchMobile
        # No CZstd: only the Mac's Debug journals (AppReplay) compress captures (docs/ios.md).
        SWIFT_INCLUDE_PATHS: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX)
        INFOPLIST_FILE: Mobile/App/Info.plist
        MARKETING_VERSION: "0.1.9"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone and iPad (TARGETED_DEVICE_FAMILY in mobileApp); never Catalyst or a Mac running the iPad build.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        # Release is what goes on a phone (docs/ios.md, Release): the executable is stripped once
        # its dSYM is made (half of it is symbols). The iPhone tests never run against Release: they need @testable and
        # the Debug demos.
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
    dependencies:
      - package: MobileTransport
      - package: Dictation
      - target: SSHHelpers
      # Embedded in Watch/ ("Embed Watch Content"): installing the phone app offers it on a paired watch.
      - target: DispatchWatch
      - target: TermMobile
        embed: false
      - target: TermAppleMobile
        embed: false
      # VideoPlayer's superclass (see project.yml's Dispatch target).
      - sdk: AVKit.framework
      - sdk: Accelerate.framework
      - sdk: CoreText.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
  DispatchMobileTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Mobile/Tests
      # The Mac's Foundation-only tests, shared by path (docs/ios.md). HelperClient's fixtures load from the checkout.
      - DispatchTests/HelperClient/HelperClientTests.swift
      - DispatchTests/ProgramStatusTests.swift
      - DispatchTests/TerminalCoreTests.swift
      - DispatchTests/TerminalFastPathTests.swift
      - DispatchTests/TermUnicode18Tests.swift
      - DispatchTests/TerminalPageMemoryTests.swift
      - DispatchTests/TerminalChecksumTests.swift
      - DispatchTests/ChatDraftTests.swift
      - DispatchTests/ChatSideQuestionTests.swift
      - DispatchTests/ChatOperationsTests.swift
      - DispatchTests/ChatTypingRevealTests.swift
      - DispatchTests/GitGraphTests.swift
      - DispatchTests/GitParsersTests.swift
      - DispatchTests/PortableTestSupport.swift
      - DispatchTests/SharedStatsVoiceTests.swift
      - DispatchTests/FilesSharedTests.swift
      - DispatchTests/SyntaxScannerTests.swift
      - DispatchTests/TerminalCatalogTests.swift
      - DispatchTests/GitReadCoreTests.swift
      - DispatchTests/HelperChatTransportTests.swift
      - DispatchTests/SurfaceSessionCoreTests.swift
      - DispatchTests/TerminalRendererPrewarmTests.swift
      - DispatchTests/HelperPolicyTests.swift
      - DispatchTests/ChatPresentationPolicyTests.swift
    dependencies:
      - target: DispatchMobile
      - target: TermMobile
        link: false
        embed: false
      - target: TermAppleMobile
        link: false
        embed: false
    settings:
      groups: [ios, mobileApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile.tests$(DISPATCH_BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DispatchMobile.app/DispatchMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Taps the running app (docs/ios.md, Testing): its own scheme, so the unit test runs never start it.
  DispatchMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Mobile/UITests
    dependencies:
      - target: DispatchMobile
    settings:
      groups: [ios, mobileApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile.uitests$(DISPATCH_BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DispatchMobile
  # Dispatch for Apple Watch (docs/watch.md): a single-target SwiftUI app, a WatchConnectivity companion of the
  # phone app, which embeds it. Its version follows the phone's: Apple requires a watch app and its companion to match
  # (the simulator build's embedded-binary validation does not check it).
  DispatchWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/App
        excludes: [Info.plist, "*.entitlements"]
      # Foundation-only, compiled into both apps.
      - path: Watch/Shared
      # The complication's entry, store and views, shared with the widget extension.
      - path: Watch/Complication
    dependencies:
      - target: DispatchWatchWidgets
    settings:
      groups: [watchApp]
      base:
        PRODUCT_NAME: DispatchWatch
        PRODUCT_MODULE_NAME: DispatchWatch
        SWIFT_INCLUDE_PATHS: ""
        # Must extend the phone app's id, suffix included, as WKCompanionAppBundleIdentifier names it.
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp
        INFOPLIST_FILE: Watch/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/App/DispatchWatch.entitlements
        MARKETING_VERSION: "0.1.9"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  # The watch's complications (docs/watch.md, Complications): a WidgetKit extension embedded in the watch app, signed as
  # it is, reading the entry the app writes to their App Group.
  DispatchWatchWidgets:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/Widgets
        excludes: [Info.plist, "*.entitlements"]
      - path: Watch/Complication
      - path: Watch/Shared
    settings:
      groups: [watchApp]
      base:
        PRODUCT_NAME: DispatchWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp.widgets
        INFOPLIST_FILE: Watch/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Widgets/DispatchWatchWidgets.entitlements
        MARKETING_VERSION: "0.1.9"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_INCLUDE_PATHS: ""
        SKIP_INSTALL: YES
  DispatchWatchTests:
    type: bundle.unit-test
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/Tests
    dependencies:
      - target: DispatchWatch
    settings:
      groups: [watchApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DispatchWatch.app/DispatchWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Taps the watch app (docs/watch.md, Testing): its own scheme, so the unit test runs never start it.
  DispatchWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/UITests
    dependencies:
      - target: DispatchWatch
    settings:
      groups: [watchApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DispatchWatch
schemes:
  DispatchMobile:
    build:
      targets:
        DispatchMobile: all
    test:
      targets: [DispatchMobileTests]
  DispatchWatch:
    build:
      targets:
        DispatchWatch: all
    test:
      targets: [DispatchWatchTests]
  DispatchMobileUITests:
    build:
      targets:
        DispatchMobile: all
        DispatchMobileUITests: [test]
    test:
      targets: [DispatchMobileUITests]
  DispatchWatchUITests:
    build:
      targets:
        DispatchWatch: all
        DispatchWatchUITests: [test]
    test:
      targets: [DispatchWatchUITests]
