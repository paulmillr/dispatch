      - Dispatch/Files/FilePreviewContent.swift
      - Dispatch/Files/FilePreviewImage.swift
      - Dispatch/Files/FilesFormatting.swift
      - Dispatch/Files/FilesModels.swift
      - Dispatch/Files/FilesSourceFailure.swift
      - Dispatch/Files/FilesWire.swift
      - Dispatch/Files/GitReadCore.swift
