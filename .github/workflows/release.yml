# One of the two release builders (docs/releasing.md, Two builders): builds a version commit with
# scripts/release/build.sh, attests the files (GitHub's signed build provenance) and keeps them as a workflow artifact.
# The signing machine downloads them, checks the attestation, builds the same commit again and signs only if both are
# the same app; publishing the release then creates the version's tag. No secret is used or reachable here.
# A version commit is one that sets the version files to a new version (scripts/release.sh makes it): pushed to main, it
# is built as a release, kept for 90 days as <cask>-<variant>-<version>. Other pushes build nothing. Started by hand from
# main or a version tag on a version commit, it builds that (another variant, if app.json has one: -f variant=NAME); from anywhere else,
# it is a rehearsal: the same build, kept for a week as <cask>-rehearsal-<variant>-<commit>, without an attestation,
# so the signing machine never takes it for a release. The same file in every app: what is the app's own comes from
# scripts/release/app.json.
name: Release build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Variant (scripts/release/app.json; empty for the default)
        type: string
        default: ''

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ github.sha }}-${{ inputs.variant || 'default' }}

jobs:
  # Which build this is, on a small Linux runner: most pushes need none.
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.kind.outputs.build }}
      release: ${{ steps.kind.outputs.release }}
    steps:
      - id: kind
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/git"
          cd "$RUNNER_TEMP/git"
          git fetch -q --depth=2 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git archive "$GITHUB_SHA" scripts/release/config.py | tar -x
          version="$(python3 -I scripts/release/config.py --commit "$GITHUB_SHA" changes-version || true)"
          build=1 release=""
          if [[ -n "$version" && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == "refs/tags/$version" ) ]]; then
            release=1
            echo "::notice::version commit of $version: a release build"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            build=""
            echo "::notice::not a version commit: nothing to build"
          else
            echo "::notice::a rehearsal of $GITHUB_REF_NAME ($GITHUB_SHA): built, not attested"
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: kind
    if: needs.kind.outputs.build == '1'
    # Xcode 27 is on this image only (a public preview, actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VARIANT: ${{ inputs.variant }}
      RELEASE: ${{ needs.kind.outputs.release }}
      SOURCE: /private/tmp/release-build
    steps:
      - name: Source of the commit
        run: |
          set -euo pipefail
          # The tree as `git archive` gives it, at the fixed path both builders use (scripts/release/build.sh).
          git init -q "$RUNNER_TEMP/git"
          git -C "$RUNNER_TEMP/git" fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          mkdir "$SOURCE"
          git -C "$RUNNER_TEMP/git" archive "$GITHUB_SHA" | tar -x -C "$SOURCE"
          config() { python3 -I "$SOURCE/scripts/release/config.py" "$@"; }
          number="$(TZ=UTC git -C "$RUNNER_TEMP/git" show -s --format=%cd --date=format-local:%Y%m%d.%H%M "$GITHUB_SHA")"
          version="$(config version)"
          variant="$(config variant "$VARIANT")"
          # The Xcode whose build release/app.json pins, whatever its folder is called: the image may name a release
          # candidate Xcode_27.2.app. The signing machine must have that build too.
          wanted="$(config get xcode_build)"
          found="" DEVELOPER_DIR=""
          for app in /Applications/Xcode*.app; do
            [[ -L "$app" ]] && continue
            build="$(DEVELOPER_DIR="$app/Contents/Developer" xcodebuild -version 2>/dev/null | sed -n 's/^Build version //p')"
            found+="$build ($app) "
            [[ "$build" != "$wanted" || -n "$DEVELOPER_DIR" ]] || DEVELOPER_DIR="$app/Contents/Developer"
          done
          [[ -n "$DEVELOPER_DIR" ]] || { echo "::error::no Xcode build $wanted (scripts/release/app.json) on this image, only: $found"; exit 1; }
          export DEVELOPER_DIR
          # setup.sh refuses an Xcode whose first launch (its license and system packages) has not run.
          xcodebuild -checkFirstLaunchStatus || sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcodebuild -showsdks
          {
            echo "DEVELOPER_DIR=$DEVELOPER_DIR"
            echo "BUILD_NUMBER=$number"
            echo "VERSION=$version"
            echo "VARIANT=$variant"
            echo "ARTIFACT=$(config get cask)$([[ -n "$RELEASE" ]] && echo "-$variant-$version" || echo "-rehearsal-$variant-${GITHUB_SHA:0:12}")"
            echo "BUILD_LOG=$(config get build_log 2> /dev/null || true)"
          } >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -euo pipefail
          cd "$SOURCE"
          RELEASE_BUILDER=github scripts/release/build.sh "$RUNNER_TEMP/out" --commit "$GITHUB_SHA" \
            --build-number "$BUILD_NUMBER" --variant "$VARIANT"

      - name: Attest
        if: env.RELEASE == '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/*

      - name: Keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ARTIFACT }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: ${{ env.RELEASE == '1' && 90 || 7 }}

      # The app's own build log, if release/app.json names one (build_log, relative to the tree).
      - name: Build log
        if: failure() && env.BUILD_LOG != ''
        run: tail -200 "$SOURCE/$BUILD_LOG" || true
