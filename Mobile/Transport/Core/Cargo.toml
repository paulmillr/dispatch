# The iPhone SSH engine: russh behind a C ABI (include/dispatch_mobile_ssh.h), wrapped by the
# MobileTransport Swift package. Its own workspace: third-party Rust enters here, never under helper/.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "dispatch-mobile-ssh"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[lib]
name = "dispatch_mobile_ssh"
crate-type = ["staticlib", "rlib"]

[dependencies]
# ring rather than aws-lc-rs: no cmake, and cc cross-compiles it for iOS with Xcode's clang. The published 0.65.0 with
# one patch (russh.patch: every rekey's host key goes through `check_server_key`), staged into build/mobile-ssh/russh by
# scripts/vendor-russh.py (scripts/build-mobile-ssh.py runs it; run it once by hand before a bare `cargo test`).
russh = { path = "../../../build/mobile-ssh/russh", version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
libc = "0.2"
# Wipes the copies of passphrases and passwords the C ABI makes (russh's key types wipe themselves).
zeroize = "1"

[dev-dependencies]
# The scripted SSH server of tests/hostile.rs (X25519, SHA-256, AES-256-GCM): already in the graph through russh.
ring = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

[profile.dev]
panic = "abort"
