[workspace]
members = ["core", "bin", "harnesses/*", "multiplexers/*", "plugins/*"]
resolver = "3"

# Archives. Thin LTO over 16 codegen units uses every core; fat LTO with one unit ran one LLVM
# thread per target (2x the build time for binaries ~19% smaller).
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

# Everyday Xcode builds (scripts/build-ssh-helper.py): incremental, so an edit rebuilds in seconds.
[profile.local]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
opt-level = 2

# json is pure Rust now (yyjson used to be built -O2 even in dev); keeps json-heavy tests fast.
[profile.dev.package.dispatch-helper-core]
opt-level = 2
