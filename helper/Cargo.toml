[workspace]
members = ["core", "bin", "harnesses/*", "multiplexers/*", "plugins/*"]
resolver = "3"

# Archives and `./run.sh --prod`: the bundled helpers are most of the download. Fat LTO with one
# unit and opt-level "s" (one LLVM thread per target, ~2x the thin-LTO build time) is ~30% smaller
# than thin LTO at O3, with latency, throughput and CPU within noise (terminals bench, Linux arm64);
# "z" was ~43% smaller but ~20% slower.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"

# Everyday Xcode builds (scripts/build-ssh-helper.py): incremental, so an edit rebuilds in seconds.
[profile.local]
inherits = "release"
lto = false
codegen-units = 256
incremental = true
opt-level = 2

# json is pure Rust now (yyjson used to be built -O2 even in dev); keeps json-heavy tests fast.
[profile.dev.package.dispatch-helper-core]
opt-level = 2

# The capture tool (bin/src/capture.rs) scans whole corpora: unoptimized, grep took 6x as long.
[profile.dev.package.dispatch-helper]
opt-level = 2
