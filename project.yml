name: Dispatch
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "$(NATIVE_ARCH_ACTUAL)"
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_LDFLAGS: ["-lc++"]
    OTHER_SWIFT_FLAGS: ["-Xcc", "-Wno-incomplete-umbrella"]
    # CZstd: the app journal's capture files (target Zstd).
    SWIFT_INCLUDE_PATHS: ["$(SRCROOT)/Vendor/Zstd"]
    # `./run.sh --prod` sets YES: the shipped app is stripped (its symbols stay in the dSYM). Off for
    # other Release builds, whose app hosts the tests (BUNDLE_LOADER needs its symbols).
    DISPATCH_STRIP_APP: NO
    # Every app's bundle id starts with this: the Pilot account's apps. `./run.sh --stable` sets yachts.dispatch, the
    # stable account's (docs/ios.md, Pilot and stable); both are named Dispatch and install side by side.
    DISPATCH_BUNDLE_ID_PREFIX: yachts.dispatch.pilot
  configs:
    # Xcode otherwise injects get-task-allow, which notarization rejects.
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
settingGroups:
  # Every iOS target. The project's ARCHS (the Mac's native architecture, arm64e on Apple silicon) matches no
  # simulator or iPhone run destination.
  ios:
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: NO
  # The iPhone and iPad app and its test bundles, signed automatically for a device (the team comes from
  # build/signing.xcconfig through Mobile/Config/Signing.xcconfig), ad hoc in the simulator.
  mobileApp:
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    # The project's Release turns this off for the notarized Mac app; without it an iPhone Release build (--prod)
    # has no application-identifier, and every Keychain write (a new key, a saved password) fails with "A required
    # entitlement is not present" (errSecMissingEntitlement).
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
  # Dispatch for Apple Watch and its tests (docs/watch.md): Apple Watch only, signed as mobileApp signs the phone's
  # (the same team and suffix, so the watch app's id stays under the phone app's).
  watchApp:
    TARGETED_DEVICE_FAMILY: "4"
    # The project's ARCHS (the Mac's arm64e) matches no watch simulator or device (arm64_32 and arm64).
    ARCHS: "$(ARCHS_STANDARD)"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    # The watch app and its widget extension share the complications' entry (docs/watch.md, Complications). A device
    # build needs this group on the team (automatic signing registers it); the simulator signs ad hoc with it.
    DISPATCH_APP_GROUP: group.$(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX)
  # The Swift terminal (Vendor/Term) is optimized with whole-module optimization in every
  # configuration: built like the app's Debug code (unoptimized, or file by file) it consumes
  # output 3-80x slower and blocks the programs writing to it.
  term:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_OPTIMIZATION_LEVEL: -O
    SWIFT_COMPILATION_MODE: wholemodule
    ENABLE_TESTABILITY: NO
# The iPhone app's SSH transport (Mobile/Transport, docs/ios.md, Transport): a local package over the Rust engine that
# scripts/build-mobile-ssh.py builds into build/mobile-ssh (run it with --fetch once before the first Xcode build).
packages:
  MobileTransport:
    path: Mobile/Transport
  # Chat dictation (Packages/Dictation): the engine (Apple's recognizer and Whisper through Packages/WhisperEngine,
  # whisper.cpp in Swift with the ggml Metal kernels, which Dictation depends on by path), shared by the Mac and the
  # iPhone apps. The settings and buttons stay in the apps.
  Dictation:
    path: Packages/Dictation
targets:
  # Static: the hardened runtime's library validation refuses ad-hoc signed
  # frameworks embedded in an ad-hoc signed app (local Release builds would not launch).
  Term:
    type: framework.static
    platform: macOS
    sources: [Vendor/Term/Sources/Term]
    settings:
      groups: [term]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yachts.dispatch.term
  TermApple:
    type: framework.static
    platform: macOS
    sources:
      - path: Vendor/Term/Sources/TermApple
        excludes: [Resources]
    dependencies:
      - target: Term
    settings:
      groups: [term]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yachts.dispatch.termapple
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  # The terminal for Dispatch for iPhone (docs/ios.md): the same sources as Term and TermApple, built for iOS.
  # Their products keep the module names Term and TermApple, so shared sources import them unchanged.
  TermMobile:
    type: framework.static
    platform: iOS
    sources: [Vendor/Term/Sources/Term]
    settings:
      groups: [term, ios]
      base:
        PRODUCT_NAME: Term
        PRODUCT_BUNDLE_IDENTIFIER: yachts.dispatch.mobile.term
  # Process launching, the pty, the AppKit view and its display link stay on the Mac (docs/ios.md).
  TermAppleMobile:
    type: framework.static
    platform: iOS
    sources:
      - path: Vendor/Term/Sources/TermApple
        excludes: [Resources, Launch.swift, Pty.swift, Frames.swift, Session.swift, TerminalView.swift]
    dependencies:
      - target: TermMobile
    settings:
      groups: [term, ios]
      base:
        PRODUCT_NAME: TermApple
        PRODUCT_BUNDLE_IDENTIFIER: yachts.dispatch.mobile.termapple
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  # Zstandard (Vendor/Zstd/PROVENANCE.md): Debug app journals are written and read with it. Only Debug code
  # calls it, so a Release link takes nothing from the archive. Optimized in every configuration: the corpus is
  # hundreds of megabytes expanded.
  Zstd:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/Zstd/lib/common
      - path: Vendor/Zstd/lib/compress
      - path: Vendor/Zstd/lib/decompress
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/Zstd/lib"]
        GCC_PREPROCESSOR_DEFINITIONS: ["XXH_NAMESPACE=ZSTD_"]
        GCC_OPTIMIZATION_LEVEL: "2"
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
  Dispatch:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Install SSH helpers
        # Built by the SSHHelpers target, in parallel with the terminal frameworks.
        script: python3 "$SRCROOT/scripts/build-ssh-helper.py" --install-only
        inputFiles: ["$(SRCROOT)/build/helper-rust/bin/darwin-arm64", "$(SRCROOT)/build/helper-rust/bin/linux-aarch64", "$(SRCROOT)/build/helper-rust/bin/linux-x86_64", "$(SRCROOT)/build/helper-rust/bin/version", "$(SRCROOT)/build/helper-rust/bin/protocol-version"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/linux-aarch64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/linux-x86_64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/version", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/protocol-version"]
    postBuildScripts:
      - name: Bundle unified helper
        script: bash "$SRCROOT/scripts/bundle-helper.sh"
        basedOnDependencyAnalysis: false
      - name: Bundle Dispatch themes
        # Always: the ghostty folder copy replaces the folder wholesale, even when this
        # script's inputs and outputs look unchanged.
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ghostty/themes"
          mkdir -p "$destination"
          cp "$SRCROOT/extras/ghostty/dispatch" "$SRCROOT/extras/ghostty/dispatch-black" "$destination/"
        inputFiles: ["$(SRCROOT)/extras/ghostty/dispatch", "$(SRCROOT)/extras/ghostty/dispatch-black"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ghostty/themes/dispatch", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ghostty/themes/dispatch-black"]
    sources:
      - path: Dispatch
        excludes: [Info.plist]
      # Ghostty's shell integration and themes, vendored (Vendor/Term/Resources/PROVENANCE.md).
      - path: Vendor/Term/Resources/ghostty
        type: folder
        buildPhase: resources
      # The terminal's fonts: TermApple is linked into the app, so it finds them in the app bundle.
      - path: Vendor/Term/Sources/TermApple/Resources
        type: folder
        buildPhase: resources
      - path: ThirdPartyLicenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).app
        CODE_SIGN_ENTITLEMENTS: Dispatch/Dispatch.entitlements
        PRODUCT_MODULE_NAME: DispatchApp
        INFOPLIST_FILE: Dispatch/Info.plist
        MARKETING_VERSION: "0.1.2"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only this target: the static terminal frameworks keep the debug info the dSYM is made from.
        DEPLOYMENT_POSTPROCESSING: "$(DISPATCH_STRIP_APP)"
        STRIP_INSTALLED_PRODUCT: "$(DISPATCH_STRIP_APP)"
    dependencies:
      - package: Dictation
      - target: SSHHelpers
      # Linked into the app (static), nothing to embed.
      - target: Term
        embed: false
      - target: TermApple
        embed: false
      - target: Zstd
        embed: false
      - sdk: Accelerate.framework
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreText.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
  DispatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DispatchTests
        excludes: [LocalToolAudit, "**/rollout-*.jsonl"]
    dependencies:
      - target: Dispatch
      # The tests use the terminal's modules directly; their code is the app's (BUNDLE_LOADER),
      # not a second copy.
      - target: Term
        link: false
        embed: false
      - target: TermApple
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).app.tests
        INFOPLIST_KEY_NSPrincipalClass: DispatchTestObserver
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dispatch.app/Contents/MacOS/Dispatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_HARDENED_RUNTIME: NO
  # Dispatch for iPhone (docs/ios.md). iOS-only sources live in Mobile/; the Foundation and SwiftUI sources it
  # shares with the Mac app are listed below by path and stay in Dispatch/.
  DispatchMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    postBuildScripts:
      # The licences: the shared folder (the helpers, fonts and themes the phone ships too) and the SSH engine's
      # crates, which only the phone links (Mobile/ThirdPartyLicenses: kept out of the Mac app's bundle).
      - name: Bundle licences
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ThirdPartyLicenses"
          mkdir -p "$destination"
          rsync -a --delete "$SRCROOT/ThirdPartyLicenses/" "$SRCROOT/Mobile/ThirdPartyLicenses/" "$destination/"
        basedOnDependencyAnalysis: false
      # The terminal's fonts, where TermApple's FontCollection looks for them on iOS (TermFonts: an iOS bundle
      # cannot have a top-level Resources folder).
      - name: Bundle terminal fonts
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TermFonts"
          mkdir -p "$destination"
          cp "$SRCROOT"/Vendor/Term/Sources/TermApple/Resources/*.ttf "$SRCROOT"/Vendor/Term/Sources/TermApple/Resources/*.txt "$destination/"
          # The Mac's terminal fonts Settings offers (TerminalFont.all; not Ioskeley Mono, 0.9 MB), and chat's Latin Modern
          # Roman (MobileChatFont).
          for font in SourceCodePro-Regular.ttf SourceCodePro-Bold.ttf SourceCodePro-Italic.ttf SourceCodePro-BoldItalic.ttf FiraCode-Regular.ttf FiraCode-Bold.ttf 0xProto-Regular.otf 0xProto-Bold.otf 0xProto-Italic.otf DepartureMono-Regular.otf lmroman10-regular.otf lmroman10-italic.otf lmroman10-bold.otf lmroman10-bolditalic.otf; do cp "$SRCROOT/Dispatch/Resources/Fonts/$font" "$destination/"; done
        inputFiles: ["$(SRCROOT)/Vendor/Term/Sources/TermApple/Resources/JetBrainsMono-Variable.ttf", "$(SRCROOT)/Vendor/Term/Sources/TermApple/Resources/JetBrainsMono-Italic-Variable.ttf", "$(SRCROOT)/Vendor/Term/Sources/TermApple/Resources/SymbolsNerdFont-Regular.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/SourceCodePro-Regular.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/SourceCodePro-Bold.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/SourceCodePro-Italic.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/SourceCodePro-BoldItalic.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/FiraCode-Regular.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/FiraCode-Bold.ttf", "$(SRCROOT)/Dispatch/Resources/Fonts/0xProto-Regular.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/0xProto-Bold.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/0xProto-Italic.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/DepartureMono-Regular.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/lmroman10-regular.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/lmroman10-italic.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/lmroman10-bold.otf", "$(SRCROOT)/Dispatch/Resources/Fonts/lmroman10-bolditalic.otf"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/JetBrainsMono-Variable.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/JetBrainsMono-Italic-Variable.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/SymbolsNerdFont-Regular.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/SourceCodePro-Regular.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/SourceCodePro-Bold.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/SourceCodePro-Italic.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/SourceCodePro-BoldItalic.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/FiraCode-Regular.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/FiraCode-Bold.ttf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/0xProto-Regular.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/0xProto-Bold.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/0xProto-Italic.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/DepartureMono-Regular.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/lmroman10-regular.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/lmroman10-italic.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/lmroman10-bold.otf", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TermFonts/lmroman10-bolditalic.otf"]
    preBuildScripts:
      - name: Build SSH engine
        script: python3 "$SRCROOT/scripts/build-mobile-ssh.py" --platform "$PLATFORM_NAME"
        basedOnDependencyAnalysis: false
      - name: Install SSH helpers
        # The phone uploads every helper (the Mac one too) to hosts: all three are gzipped resources in helper/
        # (App Store Connect refuses a Mach-O file that is not a bundle's executable; HelperBootstrap expands them).
        script: python3 "$SRCROOT/scripts/build-ssh-helper.py" --install-only
        inputFiles: ["$(SRCROOT)/build/helper-rust/bin/darwin-arm64", "$(SRCROOT)/build/helper-rust/bin/linux-aarch64", "$(SRCROOT)/build/helper-rust/bin/linux-x86_64", "$(SRCROOT)/build/helper-rust/bin/version", "$(SRCROOT)/build/helper-rust/bin/protocol-version"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/darwin-arm64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/linux-aarch64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/linux-x86_64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/version", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/protocol-version"]
    sources:
      - path: Mobile
        # Tests: DispatchMobileTests. Transport: its own Swift package; its Integration folder (the app's SSH driver)
        # is app code.
        # Demo/Fixtures: the simulator demo reads them from the source tree (Debug only, never bundled).
        excludes: [App/Info.plist, Config, Tests, UITests, Transport, ThirdPartyLicenses, Demo/Fixtures]
      - path: Mobile/Transport/Integration
      # Ghostty's bundled themes, Settings' terminal colour schemes (TerminalSchemes reads the app's themes folder).
      - path: Vendor/Term/Resources/ghostty/themes
        type: folder
        buildPhase: resources
      # The Dispatch themes (TerminalConfiguration reads them from the app's ghostty folder).
      - path: extras/ghostty
        type: folder
        buildPhase: resources
      # Shared with the Mac app (docs/ios.md, Shared sources).
      - Dispatch/Attention.swift
      - Dispatch/Chat/AgentModelMenu.swift
      - Dispatch/Chat/ChatAttachments.swift
      - Dispatch/Chat/ChatCommands.swift
      - Dispatch/Chat/ChatDrafts.swift
      - Dispatch/Chat/ChatMarkdownBlock.swift
      - Dispatch/Chat/ChatModelChoicesCache.swift
      - Dispatch/Chat/ChatModels.swift
      - Dispatch/Chat/ChatOperations.swift
      - Dispatch/Chat/ChatPatch.swift
      - Dispatch/Chat/ChatSideConversation.swift
      - Dispatch/Chat/ChatSideQuestion.swift
      - Dispatch/Chat/ChatTranscript.swift
      - Dispatch/Chat/ClaudeQuestions.swift
      - Dispatch/Chat/HelperChat.swift
      - Dispatch/Chat/ToolCommandPresentation.swift
      - Dispatch/Chat/ToolCommandWords.swift
      - Dispatch/Chat/ToolDocument.swift
      - Dispatch/Chat/ToolOrchestration.swift
      - Dispatch/Chat/ToolOutput.swift
      - Dispatch/Chat/ToolPresentation.swift
      - Dispatch/Chat/ToolPresentationCache.swift
      - Dispatch/Chat/ToolReadCommand.swift
      - Dispatch/Files/FilesFormatting.swift
      - Dispatch/Files/FilesModels.swift
      - Dispatch/Files/GitDiffPresentation.swift
      - Dispatch/Files/GitGraph.swift
      - Dispatch/Files/GitLog.swift
      - Dispatch/Files/GitModels.swift
      - Dispatch/Files/GitParsers.swift
      - Dispatch/Files/Review.swift
      - Dispatch/Files/ReviewRefresh.swift
      - Dispatch/Files/ReviewRepository.swift
      - Dispatch/Helper/AppReplay.swift
      - Dispatch/Helper/HelperBackend.swift
      - Dispatch/Helper/HelperBinary.swift
      - Dispatch/Helper/HelperClient.swift
      - Dispatch/Helper/HelperConnection.swift
      - Dispatch/Helper/HelperDescriptors.swift
      - Dispatch/Helper/HelperSession.swift
      - Dispatch/Helper/HelperTopology.swift
      - Dispatch/Helper/HelperTransport.swift
      - Dispatch/Helper/HelperWire.swift
      - Dispatch/Herdr/HerdrModels.swift
      - Dispatch/Hosts/HostRegistry.swift
      - Dispatch/Hosts/TerminalHistoryStore.swift
      - Dispatch/SSH/SSHInvocation.swift
      - Dispatch/Terminal/LineSpacing.swift
      - Dispatch/Terminal/TerminalFontScale.swift
      - Dispatch/Terminal/TextContrast.swift
      - Dispatch/Terminal/ProgramStatusStore.swift
      - Dispatch/Terminal/TerminalMachine.swift
      - Dispatch/Terminal/TerminalScrollState.swift
      - Dispatch/Views/Chrome.swift
      - Dispatch/Views/ComposerFences.swift
      - Dispatch/Views/HostGlyph.swift
      - Dispatch/Views/HostTint.swift
      - Dispatch/Themes/ColorVision.swift
      - Dispatch/Themes/SchemeGroup.swift
      - Dispatch/Themes/SchemeAudit.swift
      - Dispatch/WorkspaceModels.swift
      # The watch protocol (docs/watch.md): the phone's side of WatchConnectivity is in Mobile/Watch.
      - path: Watch/Shared
    settings:
      groups: [ios, mobileApp]
      base:
        PRODUCT_NAME: DispatchMobile
        PRODUCT_MODULE_NAME: DispatchMobile
        # No CZstd: only the Mac's Debug journals (AppReplay) compress captures (docs/ios.md).
        SWIFT_INCLUDE_PATHS: ""
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX)
        INFOPLIST_FILE: Mobile/App/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone and iPad (TARGETED_DEVICE_FAMILY in mobileApp); never Catalyst or a Mac running the iPad build.
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        # Release is what goes on a phone (docs/ios.md, Release): the executable is stripped once
        # its dSYM is made (half of it is symbols). The iPhone tests never run against Release: they need @testable and
        # the Debug demos.
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
    dependencies:
      - package: MobileTransport
      - package: Dictation
      - target: SSHHelpers
      # Embedded in Watch/ ("Embed Watch Content"): installing the phone app offers it on a paired watch.
      - target: DispatchWatch
      - target: TermMobile
        embed: false
      - target: TermAppleMobile
        embed: false
      - sdk: Accelerate.framework
      - sdk: CoreText.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
  DispatchMobileTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Mobile/Tests
      # The Mac's Foundation-only tests, shared by path (docs/ios.md). HelperClient's fixtures load from the checkout.
      - DispatchTests/HelperClient/HelperClientTests.swift
      - DispatchTests/ProgramStatusTests.swift
      - DispatchTests/TerminalCoreTests.swift
      - DispatchTests/ChatDraftTests.swift
      - DispatchTests/ChatSideQuestionTests.swift
      - DispatchTests/ChatOperationsTests.swift
      - DispatchTests/GitGraphTests.swift
      - DispatchTests/GitParsersTests.swift
      - DispatchTests/PortableTestSupport.swift
    dependencies:
      - target: DispatchMobile
      - target: TermMobile
        link: false
        embed: false
      - target: TermAppleMobile
        link: false
        embed: false
    settings:
      groups: [ios, mobileApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile.tests$(DISPATCH_BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DispatchMobile.app/DispatchMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Taps the running app (docs/ios.md, Testing): its own scheme, so the unit test runs never start it.
  DispatchMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Mobile/UITests
    dependencies:
      - target: DispatchMobile
    settings:
      groups: [ios, mobileApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile.uitests$(DISPATCH_BUNDLE_ID_SUFFIX)
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DispatchMobile
  # Dispatch for Apple Watch (docs/watch.md): a single-target SwiftUI app, a WatchConnectivity companion of the
  # phone app, which embeds it. Its version follows the phone's: Apple requires a watch app and its companion to match
  # (the simulator build's embedded-binary validation does not check it).
  DispatchWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/App
        excludes: [Info.plist, "*.entitlements"]
      # Foundation-only, compiled into both apps.
      - path: Watch/Shared
      # The complication's entry, store and views, shared with the widget extension.
      - path: Watch/Complication
    dependencies:
      - target: DispatchWatchWidgets
    settings:
      groups: [watchApp]
      base:
        PRODUCT_NAME: DispatchWatch
        PRODUCT_MODULE_NAME: DispatchWatch
        SWIFT_INCLUDE_PATHS: ""
        # Must extend the phone app's id, suffix included, as WKCompanionAppBundleIdentifier names it.
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp
        INFOPLIST_FILE: Watch/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/App/DispatchWatch.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  # The watch's complications (docs/watch.md, Complications): a WidgetKit extension embedded in the watch app, signed as
  # it is, reading the entry the app writes to their App Group.
  DispatchWatchWidgets:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/Widgets
        excludes: [Info.plist, "*.entitlements"]
      - path: Watch/Complication
      - path: Watch/Shared
    settings:
      groups: [watchApp]
      base:
        PRODUCT_NAME: DispatchWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp.widgets
        INFOPLIST_FILE: Watch/Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/Widgets/DispatchWatchWidgets.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_INCLUDE_PATHS: ""
        SKIP_INSTALL: YES
  DispatchWatchTests:
    type: bundle.unit-test
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/Tests
    dependencies:
      - target: DispatchWatch
    settings:
      groups: [watchApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DispatchWatch.app/DispatchWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
  # Taps the watch app (docs/watch.md, Testing): its own scheme, so the unit test runs never start it.
  DispatchWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    configFiles:
      Debug: Mobile/Config/Signing.xcconfig
      Release: Mobile/Config/Signing.xcconfig
    sources:
      - path: Watch/UITests
    dependencies:
      - target: DispatchWatch
    settings:
      groups: [watchApp]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).mobile$(DISPATCH_BUNDLE_ID_SUFFIX).watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DispatchWatch
aggregateTargets:
  # The Rust helper depends on nothing in Xcode, so this target builds alongside Term/TermApple
  # instead of serially inside the app target.
  SSHHelpers:
    # Dispatch for iPhone depends on it too: a simulator or device destination needs every target in the build to
    # list its platform. The script builds for macOS and Linux whatever the destination (scripts/build-ssh-helper.py).
    settings:
      SUPPORTED_PLATFORMS: macosx iphonesimulator iphoneos
    buildScripts:
      - name: Build portable SSH helpers
        script: bash "$SRCROOT/scripts/build-ssh-helper.sh" --build-only
        basedOnDependencyAnalysis: false
        inputFiles: ["$(SRCROOT)/helper", "$(SRCROOT)/Vendor/Zstd", "$(SRCROOT)/scripts/build-ssh-helper.sh", "$(SRCROOT)/scripts/build-ssh-helper.py", "$(SRCROOT)/scripts/setup-ssh-rust.py"]
        outputFiles: ["$(SRCROOT)/build/helper-rust/bin/darwin-arm64", "$(SRCROOT)/build/helper-rust/bin/linux-aarch64", "$(SRCROOT)/build/helper-rust/bin/linux-x86_64", "$(SRCROOT)/build/helper-rust/bin/version", "$(SRCROOT)/build/helper-rust/bin/protocol-version"]
schemes:
  Dispatch:
    build:
      targets:
        Dispatch: all
    test:
      targets: [DispatchTests]
      environmentVariables:
        DISPATCH_TESTING: "1"
  DispatchMobile:
    build:
      targets:
        DispatchMobile: all
    test:
      targets: [DispatchMobileTests]
  DispatchWatch:
    build:
      targets:
        DispatchWatch: all
    test:
      targets: [DispatchWatchTests]
  DispatchMobileUITests:
    build:
      targets:
        DispatchMobile: all
        DispatchMobileUITests: [test]
    test:
      targets: [DispatchMobileUITests]
  DispatchWatchUITests:
    build:
      targets:
        DispatchWatch: all
        DispatchWatchUITests: [test]
    test:
      targets: [DispatchWatchUITests]
