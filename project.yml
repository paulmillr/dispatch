# Dispatch for Mac (Dispatch.xcodeproj). The iPhone and Watch apps are project-mobile.yml's; what both share is
# project-shared.yml.
name: Dispatch
include: [project-shared.yml]
targets:
  # Static: the hardened runtime's library validation refuses ad-hoc signed
  # frameworks embedded in an ad-hoc signed app (local Release builds would not launch).
  Term:
    type: framework.static
    platform: macOS
    sources: [Vendor/Term/Sources/Term]
    settings:
      groups: [term]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yachts.dispatch.term
  TermApple:
    type: framework.static
    platform: macOS
    sources:
      - path: Vendor/Term/Sources/TermApple
        excludes: [Resources]
    dependencies:
      - target: Term
    settings:
      groups: [term]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yachts.dispatch.termapple
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  # Zstandard (Vendor/Zstd/PROVENANCE.md): Debug app journals are written and read with it. Only Debug code
  # calls it, so a Release link takes nothing from the archive. Optimized in every configuration: the corpus is
  # hundreds of megabytes expanded.
  Zstd:
    type: library.static
    platform: macOS
    sources:
      - path: Vendor/Zstd/lib/common
      - path: Vendor/Zstd/lib/compress
      - path: Vendor/Zstd/lib/decompress
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/Zstd/lib"]
        GCC_PREPROCESSOR_DEFINITIONS: ["XXH_NAMESPACE=ZSTD_"]
        GCC_OPTIMIZATION_LEVEL: "2"
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
  Dispatch:
    type: application
    platform: macOS
    preBuildScripts:
      - name: Install SSH helpers
        # Built by the SSHHelpers target, in parallel with the terminal frameworks.
        script: python3 "$SRCROOT/scripts/build-ssh-helper.py" --install-only
        inputFiles: ["$(SRCROOT)/build/helper-rust/bin/darwin-arm64", "$(SRCROOT)/build/helper-rust/bin/linux-aarch64", "$(SRCROOT)/build/helper-rust/bin/linux-x86_64", "$(SRCROOT)/build/helper-rust/bin/version", "$(SRCROOT)/build/helper-rust/bin/protocol-version"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/linux-aarch64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/linux-x86_64.gz", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/version", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/helper/protocol-version"]
    postBuildScripts:
      - name: Bundle unified helper
        script: bash "$SRCROOT/scripts/bundle-helper.sh"
        basedOnDependencyAnalysis: false
      - name: Bundle Dispatch themes
        # Always: the ghostty folder copy replaces the folder wholesale, even when this
        # script's inputs and outputs look unchanged.
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          destination="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/ghostty/themes"
          mkdir -p "$destination"
          cp "$SRCROOT/extras/ghostty/dispatch" "$SRCROOT/extras/ghostty/dispatch-black" "$destination/"
        inputFiles: ["$(SRCROOT)/extras/ghostty/dispatch", "$(SRCROOT)/extras/ghostty/dispatch-black"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ghostty/themes/dispatch", "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ghostty/themes/dispatch-black"]
    sources:
      - path: Dispatch
        excludes: [Info.plist]
      # Ghostty's shell integration and themes, vendored (Vendor/Term/Resources/PROVENANCE.md).
      - path: Vendor/Term/Resources/ghostty
        type: folder
        buildPhase: resources
      # The terminal's fonts: TermApple is linked into the app, so it finds them in the app bundle.
      - path: Vendor/Term/Sources/TermApple/Resources
        type: folder
        buildPhase: resources
      - path: ThirdPartyLicenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).app
        CODE_SIGN_ENTITLEMENTS: Dispatch/Dispatch.entitlements
        PRODUCT_MODULE_NAME: DispatchApp
        INFOPLIST_FILE: Dispatch/Info.plist
        MARKETING_VERSION: "0.1.7"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Only this target: the static terminal frameworks keep the debug info the dSYM is made from.
        DEPLOYMENT_POSTPROCESSING: "$(DISPATCH_STRIP_APP)"
        STRIP_INSTALLED_PRODUCT: "$(DISPATCH_STRIP_APP)"
    dependencies:
      - package: Dictation
      - target: SSHHelpers
      # Linked into the app (static), nothing to embed.
      - target: Term
        embed: false
      - target: TermApple
        embed: false
      - target: Zstd
        embed: false
      # SwiftUI's VideoPlayer (_AVKit_SwiftUI) subclasses AVKit's player view, and nothing names AVKit itself:
      # unlinked, the first video played aborts (superclass metadata not found).
      - sdk: AVKit.framework
      - sdk: Accelerate.framework
      - sdk: AppKit.framework
      - sdk: Carbon.framework
      - sdk: CoreText.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
  # TerminalPageMemoryTests measures a surface's footprint in a process of its own. Built with the app (not compiled
  # by the test with whichever swiftc the machine has), so a test VM whose Xcode is older runs it too.
  TerminalPageMemoryProbe:
    type: tool
    platform: macOS
    sources: [test/fixtures/terminal-page-memory]
    dependencies:
      - target: Term
    settings:
      base:
        SWIFT_OPTIMIZATION_LEVEL: -O
        # A top-level script, as swiftc compiled it before (Swift 5 mode: no actor isolation for its globals).
        SWIFT_VERSION: "5"
        ENABLE_HARDENED_RUNTIME: NO
  DispatchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DispatchTests
        excludes: [LocalToolAudit, "**/rollout-*.jsonl"]
    dependencies:
      - target: Dispatch
      - target: TerminalPageMemoryProbe
        link: false
        embed: false
      # The tests use the terminal's modules directly; their code is the app's (BUNDLE_LOADER),
      # not a second copy.
      - target: Term
        link: false
        embed: false
      - target: TermApple
        link: false
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DISPATCH_BUNDLE_ID_PREFIX).app.tests
        INFOPLIST_KEY_NSPrincipalClass: DispatchTestObserver
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dispatch.app/Contents/MacOS/Dispatch"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_HARDENED_RUNTIME: NO
schemes:
  Dispatch:
    build:
      targets:
        Dispatch: all
    test:
      targets: [DispatchTests]
      environmentVariables:
        DISPATCH_TESTING: "1"
