[package]
name = "dispatch-helper4"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
dispatch-helper4-core = { path = "../core" }
dispatch-helper4-tmux = { path = "../multiplexers/tmux", optional = true }
dispatch-helper4-native = { path = "../multiplexers/native" }
dispatch-helper4-herdr = { path = "../multiplexers/herdr" }
dispatch-helper4-claude = { path = "../harnesses/claude" }
dispatch-helper4-pi = { path = "../harnesses/pi" }
dispatch-helper4-nanocodex = { path = "../harnesses/nanocodex" }
dispatch-helper4-codex = { path = "../harnesses/codex" }
dispatch-helper4-files = { path = "../plugins/files" }
dispatch-helper4-stats = { path = "../plugins/stats" }

[features]
default = ["tmux"]
tmux = ["dep:dispatch-helper4-tmux"]
capture = ["dispatch-helper4-core/capture"]


[[bin]]
name = "dispatch-helper4"
path = "src/main.rs"
test = false

[[bench]]
name = "terminals"
path = "benches/terminals.bench.rs"
harness = false
