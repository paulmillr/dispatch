[workspace]
members = ["core", "bin", "harnesses/*", "multiplexers/*", "plugins/*"]
resolver = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# json is pure Rust now (yyjson used to be built -O2 even in dev); keeps json-heavy tests fast.
[profile.dev.package.dispatch-helper4-core]
opt-level = 2
